# ComicFrog — Docker Compose
#
# Local build (default — no registry login required):
#   docker compose up -d --build
#   open http://localhost:3000
#
# Pull pre-built image from GitHub Container Registry:
#   COMICFROG_IMAGE=ghcr.io/leemotheyer/comicfrog:latest docker compose pull
#   COMICFROG_IMAGE=ghcr.io/leemotheyer/comicfrog:latest docker compose up -d
#
# Optional: copy .env.example to .env to pre-seed Froglog credentials or change the host port.

name: comicfrog

services:
  comicfrog:
    build:
      context: .
      dockerfile: Dockerfile
    # Tags the local build; override COMICFROG_IMAGE to pull from GHCR instead.
    image: ${COMICFROG_IMAGE:-comicfrog:local}
    container_name: comicfrog

    restart: unless-stopped

    ports:
      # Host port : container port (ComicFrog listens on 3000 inside the container)
      - "${PORT:-3000}:3000"

    environment:
      PORT: 3000
      FROGLOG_API_URL: ${FROGLOG_API_URL:-https://api.froglog.co.uk/api}
      FROGLOG_USERNAME: ${FROGLOG_USERNAME:-}
      FROGLOG_PASSWORD: ${FROGLOG_PASSWORD:-}
      DATA_DIR: /app/backend/data

    volumes:
      # Stores Froglog credentials configured via the Settings page across restarts/upgrades
      - comicfrog-data:/app/backend/data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  comicfrog-data:
